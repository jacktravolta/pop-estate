services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pop-estate-app-1
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - ./var:/var/www/html/var
      - ./secrets/jwt:/var/www/html/config/jwt:ro
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://pop:pop_estate_secret@database:5432/pop_estate?serverVersion=16&charset=utf8
      DATABASE_RO_URL: postgresql://pop_ro:ro_secret@database:5432/pop_estate?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      OLLAMA_URL: http://ollama:11434
      IVA_RATE: 0.19
      JWT_PASSPHRASE: jwt_secret
    networks:
      - pop_network
  database:
    image: pgvector/pgvector:pg16
    container_name: pop-estate-db-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: pop_estate
      POSTGRES_USER: pop
      POSTGRES_PASSWORD: pop_estate_secret
      POSTGRES_RO_USER: pop_ro
      POSTGRES_RO_PASSWORD: ro_secret
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pop -d pop_estate"]
      interval: 5s
      retries: 10
    networks:
      - pop_network
  nginx:
    image: nginx:alpine
    container_name: pop-estate-nginx-1
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pop_network
  redis:
    image: redis:alpine
    container_name: pop-estate-redis-1
    restart: unless-stopped
    networks:
      - pop_network
  ollama:
    image: ollama/ollama:latest
    container_name: pop-estate-ollama-1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - pop_network
volumes:
  db_data:
  ollama_data:
networks:
  pop_network:
    driver: bridge
